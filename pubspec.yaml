name: cursor_remote
description: CursorRemote — remote control Cursor IDE from Android
publish_to: "none"
version: 1.0.6+7

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_logo.png
  adaptive_icon_background: "#12151C"
  adaptive_icon_foreground: assets/app_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
